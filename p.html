<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>auto retrato</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div id="meu-player"></div>

    <script>
     const video = document.createElement('video');
     video.src = 'video.mp4';
     video.width = 640;
     video.height = 360;
     video.controls = true;
     video.autoplay = false;
     const container = document.getElementById('meu-player');
     container.appendChild(video);
    </script>

</body>
</html>
